name: "Build sshpass"

on:
  workflow_dispatch:  # Manual trigger only

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  SSHPASS_VERSION: "1.10"
  SSHPASS_SOURCE_SHA256: "ad1106c203cbb56185ca3bad8c6ccafca3b4064696194da879f81c8d7bdfeeda"

jobs:
  build-sshpass:
    name: "Build sshpass ${{ matrix.arch }}"
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runs-on: macos-26
          - arch: x86_64
            runs-on: macos-15-intel
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-1
    steps:
      - name: "Checkout"
        uses: actions/checkout@v6

      - name: "Download and verify sshpass source"
        run: |
          VERSION="${{ env.SSHPASS_VERSION }}"
          SOURCE_URL="https://sourceforge.net/projects/sshpass/files/sshpass/${VERSION}/sshpass-${VERSION}.tar.gz/download"

          echo "Downloading sshpass ${VERSION} source..."
          curl -L -o "sshpass-${VERSION}.tar.gz" "$SOURCE_URL"

          # Verify source checksum
          echo "Verifying source checksum..."
          echo "${{ env.SSHPASS_SOURCE_SHA256 }}  sshpass-${VERSION}.tar.gz" | shasum -a 256 -c -

          echo "Source downloaded and verified"

      - name: "Build sshpass for macOS ${{ matrix.arch }}"
        run: |
          VERSION="${{ env.SSHPASS_VERSION }}"

          # Extract source
          echo "Extracting source..."
          tar -xzf "sshpass-${VERSION}.tar.gz"
          cd "sshpass-${VERSION}"

          # Configure for macOS with target architecture
          echo "Configuring build for ${{ matrix.arch }}..."
          ./configure \
            CC="clang" \
            CFLAGS="-arch ${{ matrix.arch }} -mmacosx-version-min=14.0" \
            --prefix="${GITHUB_WORKSPACE}/install"

          # Build
          echo "Compiling..."
          make -j$(sysctl -n hw.ncpu)

          # Install to temporary directory
          echo "Installing..."
          make install

          # Verify binary architecture
          echo "Verifying binary architecture..."
          lipo -info "${GITHUB_WORKSPACE}/install/bin/sshpass"
          file "${GITHUB_WORKSPACE}/install/bin/sshpass"

          echo "Build completed successfully"

      - name: "Create archive"
        run: |
          VERSION="${{ env.SSHPASS_VERSION }}"
          ARCHIVE_NAME="sshpass-${VERSION}-darwin-${{ matrix.arch }}.tar.gz"

          cd "${GITHUB_WORKSPACE}/install/bin"

          # Create archive with just the binary at root
          tar -czf "${GITHUB_WORKSPACE}/${ARCHIVE_NAME}" sshpass

          # Verify archive contents
          echo "Archive contents:"
          tar -tzf "${GITHUB_WORKSPACE}/${ARCHIVE_NAME}"

          echo "Created ${ARCHIVE_NAME}"

      - name: "Import signing certificate"
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          echo "$BUILD_CERTIFICATE_BASE64" | base64 --decode > $RUNNER_TEMP/certificate.p12
          security import $RUNNER_TEMP/certificate.p12 -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          rm $RUNNER_TEMP/certificate.p12
          echo "Signing certificate imported"

      - name: "Sign sshpass binary"
        env:
          SIGNING_IDENTITY: ${{ secrets.SIGNING_IDENTITY }}
        run: |
          VERSION="${{ env.SSHPASS_VERSION }}"
          ARCHIVE_NAME="sshpass-${VERSION}-darwin-${{ matrix.arch }}.tar.gz"

          tar -xzf "$ARCHIVE_NAME"

          codesign --force --sign "$SIGNING_IDENTITY" --timestamp --options runtime sshpass

          rm "$ARCHIVE_NAME"
          tar -czf "$ARCHIVE_NAME" sshpass
          rm sshpass

          echo "sshpass signed"

      - name: "Upload archive to R2 with SHA-256 checksum"
        run: |
          VERSION="${{ env.SSHPASS_VERSION }}"
          ARCHIVE_NAME="sshpass-${VERSION}-darwin-${{ matrix.arch }}.tar.gz"

          if [[ ! -f "$ARCHIVE_NAME" ]]; then
            echo "[ERROR] Archive not found: $ARCHIVE_NAME"
            exit 1
          fi

          # Upload with native SHA-256 checksum (R2 calculates and returns checksum)
          UPLOAD_RESULT=$(aws s3api put-object \
            --bucket ${{ secrets.R2_BUCKET_NAME }} \
            --key "$ARCHIVE_NAME" \
            --body "$ARCHIVE_NAME" \
            --endpoint-url ${{ secrets.R2_ENDPOINT }} \
            --checksum-algorithm SHA256 \
            --metadata tool="sshpass",version="$VERSION",arch="${{ matrix.arch }}" \
            --output json)

          # Extract checksum from upload response and convert to hex
          CHECKSUM_BASE64=$(echo "$UPLOAD_RESULT" | jq -r '.ChecksumSHA256')
          CHECKSUM_HEX=$(echo "$CHECKSUM_BASE64" | base64 -d | xxd -p -c 256)

          echo "Uploaded $ARCHIVE_NAME (SHA-256: $CHECKSUM_HEX)"

          # Save checksum info (format: version,arch,sha256,filename)
          echo "${VERSION},${{ matrix.arch }},${CHECKSUM_HEX},${ARCHIVE_NAME}" > checksum-sshpass-${{ matrix.arch }}.txt

      - name: "Upload checksum info"
        uses: actions/upload-artifact@v6
        with:
          name: checksum-sshpass-${{ matrix.arch }}
          path: checksum-sshpass-${{ matrix.arch }}.txt
          retention-days: 1

  update-metadata:
    name: "Update metadata files"
    runs-on: ubuntu-latest
    needs: [build-sshpass]
    if: always()
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-1
    steps:
      - name: "Download checksum artifacts"
        uses: actions/download-artifact@v7
        with:
          pattern: checksum-sshpass-*
          merge-multiple: true

      - name: "Update metadata"
        run: |
          for arch in arm64 x86_64; do
            CHECKSUM_FILE="checksum-sshpass-${arch}.txt"

            if [[ ! -f "$CHECKSUM_FILE" ]]; then
              echo "No checksum for $arch (build may have failed), skipping"
              continue
            fi

            # Read checksum info (format: version,arch,sha256,filename)
            IFS=',' read -r VERSION ARCH SHA256 FILENAME < "$CHECKSUM_FILE"

            # Create metadata
            jq -n \
              --arg version "$VERSION" \
              --arg sha256 "$SHA256" \
              --arg filename "$FILENAME" \
              '{
                "version": $version,
                "sha256": $sha256,
                "filename": $filename
              }' > metadata-sshpass-darwin-${arch}.json

            echo "Created metadata-sshpass-darwin-${arch}.json:"
            cat metadata-sshpass-darwin-${arch}.json

            # Upload to R2
            aws s3 cp metadata-sshpass-darwin-${arch}.json s3://${{ secrets.R2_BUCKET_NAME }}/metadata-sshpass-darwin-${arch}.json --endpoint-url ${{ secrets.R2_ENDPOINT }} >/dev/null
            echo "Uploaded metadata-sshpass-darwin-${arch}.json"
          done
