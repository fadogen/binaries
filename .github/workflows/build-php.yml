name: "Build PHP"

on:
  schedule:
    - cron: '0 */6 * * *'  # Every 6 hours (4 times a day)
  workflow_dispatch:

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  check-and-sync:
    name: "Check PHP versions and sync"
    runs-on: ubuntu-latest
    outputs:
      build-matrix: ${{ steps.sync.outputs.matrix }}
      eol-versions: ${{ steps.sync.outputs.eol }}
      should-build: ${{ steps.sync.outputs.should-build }}
      supported-versions: ${{ steps.sync.outputs.supported-versions }}
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-1
    steps:
      - name: "Checkout"
        uses: actions/checkout@v6

      - name: "Fetch FrankenPHP supported versions"
        run: |
          echo "Fetching serversideup PHP versions config..."
          curl -fsSL "https://raw.githubusercontent.com/serversideup/docker-php/main/scripts/conf/php-versions-base-config.yml" -o serversideup-config.yml

          # Extract FrankenPHP supported versions using yq
          FRANKENPHP_VERSIONS=$(yq -r '
            [.php_versions[].minor_versions[].minor] as $all |
            [.php_variations[] | select(.name == "frankenphp") | .excluded_minor_versions[]] as $excluded |
            ($all - $excluded) | sort | reverse | join(",")
          ' serversideup-config.yml)

          echo "FrankenPHP supported versions: $FRANKENPHP_VERSIONS"
          echo "$FRANKENPHP_VERSIONS" > frankenphp_versions.txt

      - name: "Sync PHP versions"
        id: sync
        run: |
          # Download metadata for each os+arch combination
          for os in darwin linux; do
            for arch in arm64 x86_64; do
              if aws s3 cp s3://${{ secrets.R2_BUCKET_NAME }}/metadata-php-${os}-${arch}.json metadata-php-${os}-${arch}.json --endpoint-url ${{ secrets.R2_ENDPOINT }} 2>/dev/null; then
                echo "Downloaded existing metadata-php-${os}-${arch}.json"
              else
                echo '{}' > metadata-php-${os}-${arch}.json
                echo "Created empty metadata-php-${os}-${arch}.json"
              fi
            done
          done

          echo "Fetching PHP.net API..."
          curl -fsSL https://www.php.net/releases/index.php?json > api_response.json

          python3 .github/scripts/php_build_manager.py check-versions
          cat github_output.txt >> "$GITHUB_OUTPUT"

  build:
    name: "Build PHP ${{ matrix.php-version }} (${{ matrix.os }}/${{ matrix.arch }})"
    runs-on: ${{ matrix.runs-on }}
    needs: [check-and-sync]
    if: needs.check-and-sync.outputs.should-build == 'true'
    timeout-minutes: 240
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-1
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.check-and-sync.outputs.build-matrix) }}
    steps:
      - name: "Checkout"
        uses: actions/checkout@v6

      - name: "Select latest Xcode"
        if: matrix.os == 'darwin'
        run: sudo xcode-select -s /Applications/Xcode_26.1.1.app/Contents/Developer

      - name: "Setup PHP"
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          tools: pecl, composer
          extensions: curl, openssl, mbstring
          ini-values: memory_limit=-1
        env:
          phpts: nts

      - name: "Cache downloads"
        uses: actions/cache@v5
        with:
          path: downloads
          key: php-dependencies-${{ matrix.os }}-${{ matrix.arch }}

      - name: "Download sources"
        run: |
          # On Linux, use glibc to support shared extensions (musl doesn't support dlopen)
          # - x86_64: use native gcc (SPC_LIBC=glibc)
          # - arm64: use Zig cross-compiler (SPC_TARGET) because native GCC has libsodium NEON bugs
          if [[ "${{ matrix.os }}" == "linux" ]]; then
            if [[ "${{ matrix.arch }}" == "arm64" ]]; then
              export SPC_TARGET=aarch64-linux-gnu
            else
              export SPC_LIBC=glibc
            fi
          fi

          EXTENSIONS="bcmath,bz2,calendar,ctype,curl,dba,dom,exif,ffi,fileinfo,filter,ftp,gd,gmp,iconv,igbinary,imagick,imap,intl,ldap,lz4,mbregex,mbstring,mongodb,mysqli,mysqlnd,opcache,openssl,pcntl,pdo,pdo_mysql,pdo_pgsql,pdo_sqlite,pdo_sqlsrv,pgsql,phar,posix,readline,redis,session,shmop,simplexml,soap,sockets,sodium,sqlite3,sqlsrv,sysvmsg,sysvsem,sysvshm,tokenizer,xml,xmlreader,xmlwriter,xsl,zip,zlib"

          # Disable extensions not yet compatible with PHP 8.5
          if [[ "${{ matrix.php-version }}" == "8.5" ]]; then
            echo "PHP 8.5 detected: disabling pdo_sqlsrv, sqlsrv"
            EXTENSIONS=$(echo "$EXTENSIONS" | sed 's/,pdo_sqlsrv,/,/g; s/,sqlsrv,/,/g')
          fi

          DOWN_CMD="curl -fsSL -o spc https://dl.static-php.dev/static-php-cli/spc-bin/nightly/${{ matrix.spc-binary }} && chmod +x spc && ./spc doctor --auto-fix && ./spc download"

          # Include xdebug in download for shared build
          DOWNLOAD_EXTENSIONS="$EXTENSIONS,xdebug"
          DOWNLOAD_CMD="$DOWN_CMD --with-php=${{ matrix.php-version }} --for-extensions=\"$DOWNLOAD_EXTENSIONS\" --ignore-cache-sources=php-src --prefer-pre-built"
          eval "$DOWNLOAD_CMD"

          echo "EXTENSIONS=$EXTENSIONS" >> $GITHUB_ENV

      - name: "Apply IMAP patches"
        if: matrix.os == 'linux'
        run: |
          # Apply IMAP compatibility patches before build (Linux only)
          .github/scripts/patch_imap.sh

      - name: "Create libcrypt stub for Zig"
        if: matrix.os == 'linux' && matrix.arch == 'arm64'
        run: |
          # Zig's sysroot doesn't have libcrypt, create a stub for IMAP's crypt() dependency
          mkdir -p buildroot/lib
          cat > /tmp/crypt_stub.c << 'EOF'
          char *crypt(const char *phrase, const char *setting) { (void)phrase; (void)setting; return 0; }
          char *crypt_r(const char *phrase, const char *setting, void *data) { (void)phrase; (void)setting; (void)data; return 0; }
          EOF
          gcc -c -fPIC -O2 -o /tmp/crypt_stub.o /tmp/crypt_stub.c
          ar rcs buildroot/lib/libcrypt.a /tmp/crypt_stub.o
          rm -f /tmp/crypt_stub.c /tmp/crypt_stub.o

      - name: "Build PHP"
        run: |
          export SPC_PHP_VERSION_SHORT=$(echo ${{ matrix.php-version }} | sed 's/\.//g' | cut -c1-2)

          # On Linux, use glibc to support shared extensions (musl doesn't support dlopen)
          # - x86_64: use native gcc (SPC_LIBC=glibc)
          # - arm64: use Zig cross-compiler (SPC_TARGET) because native GCC has libsodium NEON bugs
          if [[ "${{ matrix.os }}" == "linux" ]]; then
            if [[ "${{ matrix.arch }}" == "arm64" ]]; then
              export SPC_TARGET=aarch64-linux-gnu
            else
              export SPC_LIBC=glibc
            fi
          fi

          ./spc build $EXTENSIONS --build-cli --build-fpm --build-shared=xdebug \
            -P .github/scripts/patch_fadogen_ini_scan.php

      - name: "Upload build logs on failure"
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ matrix.php-version }}-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            log/
            source/php-src/config.log
          retention-days: 7

      - name: "Import signing certificate"
        if: matrix.os == 'darwin'
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          echo "$BUILD_CERTIFICATE_BASE64" | base64 --decode > $RUNNER_TEMP/certificate.p12
          security import $RUNNER_TEMP/certificate.p12 -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          rm $RUNNER_TEMP/certificate.p12
          echo "Signing certificate imported"

      - name: "Sign PHP binaries"
        if: matrix.os == 'darwin'
        env:
          SIGNING_IDENTITY: ${{ secrets.SIGNING_IDENTITY }}
        run: |
          ENTITLEMENTS=".github/scripts/entitlements-php.plist"

          echo "==> Signing PHP CLI..."
          codesign --force --sign "$SIGNING_IDENTITY" --timestamp --options runtime \
            --entitlements "$ENTITLEMENTS" \
            buildroot/bin/php

          echo "==> Signing PHP-FPM..."
          codesign --force --sign "$SIGNING_IDENTITY" --timestamp --options runtime \
            --entitlements "$ENTITLEMENTS" \
            buildroot/bin/php-fpm

          # Sign extensions .so (without entitlements)
          echo "==> Signing extensions..."
          find buildroot -name "*.so" -type f | while read -r so_file; do
            echo "    Signing: $(basename "$so_file")"
            codesign --force --sign "$SIGNING_IDENTITY" --timestamp --options runtime "$so_file"
          done

          echo "==> Verifying signatures..."
          codesign --verify --strict buildroot/bin/php
          codesign --verify --strict buildroot/bin/php-fpm

          echo "All PHP binaries signed and verified"

      - name: "Create and Upload PHP archive to R2 with SHA-256"
        run: |
          python3 .github/scripts/php_build_manager.py create-archive \
            --php-version ${{ matrix.full-version }} \
            --os ${{ matrix.os }} \
            --arch ${{ matrix.arch }}

          source archive_info.txt
          echo "Uploading: $ARCHIVE_NAME"

          UPLOAD_RESULT=$(aws s3api put-object \
            --bucket ${{ secrets.R2_BUCKET_NAME }} \
            --key "$ARCHIVE_NAME" \
            --body "$ARCHIVE_NAME" \
            --endpoint-url ${{ secrets.R2_ENDPOINT }} \
            --checksum-algorithm SHA256 \
            --metadata phpversion="${{ matrix.full-version }}",majorminor="${{ matrix.php-version }}",os="${{ matrix.os }}",arch="${{ matrix.arch }}" \
            --output json)

          CHECKSUM_BASE64=$(echo "$UPLOAD_RESULT" | jq -r '.ChecksumSHA256')
          CHECKSUM_HEX=$(echo "$CHECKSUM_BASE64" | base64 -d | xxd -p -c 256)

          echo "Uploaded: $ARCHIVE_NAME"
          echo "SHA-256: $CHECKSUM_HEX"

          echo "CHECKSUM_SHA256=$CHECKSUM_HEX" >> $GITHUB_ENV

      - name: "Save checksum"
        run: |
          source archive_info.txt

          echo "${{ matrix.full-version }},${{ matrix.os }},${{ matrix.arch }},$CHECKSUM_SHA256,$ARCHIVE_NAME" > checksum-${{ matrix.full-version }}-${{ matrix.os }}-${{ matrix.arch }}.txt
          echo "Checksum saved: ${{ matrix.full-version }},${{ matrix.os }},${{ matrix.arch }},$CHECKSUM_SHA256,$ARCHIVE_NAME"

      - name: "Upload checksum info"
        uses: actions/upload-artifact@v6
        with:
          name: checksum-${{ matrix.full-version }}-${{ matrix.os }}-${{ matrix.arch }}
          path: checksum-${{ matrix.full-version }}-${{ matrix.os }}-${{ matrix.arch }}.txt
          retention-days: 1

  update-metadata:
    name: "Update metadata files"
    runs-on: ubuntu-latest
    needs: [check-and-sync, build]
    if: always() && needs.check-and-sync.outputs.should-build == 'true'
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-1
    steps:
      - name: "Checkout"
        uses: actions/checkout@v6

      - name: "Download checksums"
        uses: actions/download-artifact@v7
        with:
          pattern: checksum-*
          merge-multiple: true

      - name: "Update metadata files"
        run: |
          # Download existing metadata for each os+arch combination
          for os in darwin linux; do
            for arch in arm64 x86_64; do
              if aws s3 cp s3://${{ secrets.R2_BUCKET_NAME }}/metadata-php-${os}-${arch}.json metadata-php-${os}-${arch}.json --endpoint-url ${{ secrets.R2_ENDPOINT }} 2>/dev/null; then
                echo "Downloaded existing metadata-php-${os}-${arch}.json"
              else
                echo '{}' > metadata-php-${os}-${arch}.json
                echo "Created empty metadata-php-${os}-${arch}.json"
              fi
            done
          done

          BUILD_MATRIX='${{ needs.check-and-sync.outputs.build-matrix }}'

          ALL_CHECKSUMS=$(cat checksum-*.txt 2>/dev/null | grep -v "^$")

          SUPPORTED_VERSIONS='${{ needs.check-and-sync.outputs.supported-versions }}'

          python3 .github/scripts/php_build_manager.py update-metadata \
            --build-matrix "$BUILD_MATRIX" \
            --archive-checksums "$ALL_CHECKSUMS" \
            --supported-versions "$SUPPORTED_VERSIONS"

          # Upload all metadata files
          for os in darwin linux; do
            for arch in arm64 x86_64; do
              aws s3 cp metadata-php-${os}-${arch}.json s3://${{ secrets.R2_BUCKET_NAME }}/metadata-php-${os}-${arch}.json --endpoint-url ${{ secrets.R2_ENDPOINT }}
              echo "Uploaded metadata-php-${os}-${arch}.json to R2"
            done
          done

      - name: "Cleanup old binaries"
        run: |
          echo "Starting cleanup of old PHP binaries..."

          BUILD_MATRIX='${{ needs.check-and-sync.outputs.build-matrix }}'

          # Process each os+architecture
          for os in darwin linux; do
            for arch in arm64 x86_64; do
              echo "Processing cleanup for ${os}/${arch}..."
              METADATA_FILE="metadata-php-${os}-${arch}.json"

              echo "$BUILD_MATRIX" | jq -r ".include[] | select(.os == \"$os\" and .arch == \"$arch\") | .[\"php-version\"]" | sort -u | while read php_version; do
                [[ -z "$php_version" ]] && continue
                echo "Cleaning up old binaries for PHP $php_version (${os}/${arch})"

                CURRENT_FILENAME=$(jq -r ".\"$php_version\".filename // \"\"" "$METADATA_FILE")

                if [[ -z "$CURRENT_FILENAME" ]]; then
                  echo "  No current filename found in metadata for PHP $php_version (${os}/${arch})"
                  continue
                fi

                echo "  Current file: $CURRENT_FILENAME"

                # List files matching pattern php-{version}.*-{os}-{arch}.tar.gz
                aws s3api list-objects-v2 \
                  --bucket ${{ secrets.R2_BUCKET_NAME }} \
                  --prefix "php-$php_version." \
                  --endpoint-url ${{ secrets.R2_ENDPOINT }} \
                  --query 'Contents[].Key' \
                  --output text | tr '\t' '\n' | grep -- "\-${os}-${arch}\.tar\.gz$" | while read -r file_key; do
                  if [[ "$file_key" != "$CURRENT_FILENAME" ]] && [[ "$file_key" != "None" ]] && [[ -n "$file_key" ]]; then
                    echo "  Deleting old binary: $file_key"
                    aws s3 rm s3://${{ secrets.R2_BUCKET_NAME }}/"$file_key" \
                      --endpoint-url ${{ secrets.R2_ENDPOINT }} || echo "  Failed to delete $file_key"
                  fi
                done
              done
            done
          done

          echo "Cleanup completed"
