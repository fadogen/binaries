name: "Migrate to Multi-OS Format"

# This workflow is a ONE-SHOT migration to rename existing files:
#   - metadata-services-{arch}.json → metadata-services-darwin-{arch}.json
#   - {service}-{version}-{arch}.tar.gz → {service}-{version}-darwin-{arch}.tar.gz
#
# Run this ONCE before deploying the multi-OS build workflow.
# After successful migration, this workflow can be deleted.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (show what would be done without making changes)'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  migrate:
    name: "Migrate files to multi-OS format"
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-1
      DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - name: "Checkout"
        uses: actions/checkout@v6

      - name: "Show migration plan"
        run: |
          echo "╔════════════════════════════════════════╗"
          echo "║  Migration to Multi-OS Metadata Format  ║"
          echo "╚════════════════════════════════════════╝"
          echo ""
          echo "DRY_RUN: $DRY_RUN"
          echo ""
          echo "This migration will:"
          echo "  1. Clean up corrupted multipart uploads"
          echo "  2. Rename metadata-services-{arch}.json → metadata-services-darwin-{arch}.json"
          echo "  3. Update filenames inside metadata JSON"
          echo "  4. Rename archive files to include 'darwin' in the name"
          echo ""

      - name: "Cleanup ALL incomplete multipart uploads"
        run: |
          echo "=== Cleaning up ALL incomplete multipart uploads ==="

          # List ALL incomplete multipart uploads in the bucket
          uploads=$(aws s3api list-multipart-uploads \
            --bucket ${{ secrets.R2_BUCKET_NAME }} \
            --endpoint-url ${{ secrets.R2_ENDPOINT }} \
            --query 'Uploads[].{Key:Key,UploadId:UploadId}' \
            --output json 2>/dev/null || echo "[]")

          if [[ "$uploads" == "[]" || "$uploads" == "null" || -z "$uploads" ]]; then
            echo "No incomplete multipart uploads found"
          else
            echo "Found incomplete uploads:"
            echo "$uploads" | jq -r '.[] | "  - \(.Key)"'

            echo "$uploads" | jq -r '.[] | "\(.Key) \(.UploadId)"' | while read key upload_id; do
              if [[ -n "$upload_id" && "$upload_id" != "null" ]]; then
                if [[ "$DRY_RUN" == "true" ]]; then
                  echo "  [DRY RUN] Would abort upload for $key"
                else
                  aws s3api abort-multipart-upload \
                    --bucket ${{ secrets.R2_BUCKET_NAME }} \
                    --endpoint-url ${{ secrets.R2_ENDPOINT }} \
                    --key "$key" \
                    --upload-id "$upload_id" || true
                  echo "  Aborted: $key"
                fi
              fi
            done
          fi

          echo "=== Cleanup complete ==="

      - name: "Migrate metadata files"
        run: |
          for arch in arm64 x86_64; do
            old_name="metadata-services-${arch}.json"
            new_name="metadata-services-darwin-${arch}.json"

            echo "=== Processing $old_name ==="

            # Check if old file exists
            if ! aws s3api head-object --bucket ${{ secrets.R2_BUCKET_NAME }} --key "$old_name" --endpoint-url ${{ secrets.R2_ENDPOINT }} >/dev/null 2>&1; then
              echo "  Skip: $old_name (not found or already migrated)"
              continue
            fi

            # Check if new file already exists
            if aws s3api head-object --bucket ${{ secrets.R2_BUCKET_NAME }} --key "$new_name" --endpoint-url ${{ secrets.R2_ENDPOINT }} >/dev/null 2>&1; then
              echo "  Skip: $new_name (already exists)"
              continue
            fi

            # Download old metadata
            aws s3 cp "s3://${{ secrets.R2_BUCKET_NAME }}/$old_name" "/tmp/$old_name" --endpoint-url ${{ secrets.R2_ENDPOINT }}
            echo "  Downloaded $old_name"

            # Update filenames in metadata JSON
            # Replace: "filename": "service-version-arch.tar.gz"
            # With:    "filename": "service-version-darwin-arch.tar.gz"
            sed "s/-${arch}\.tar\.gz/-darwin-${arch}.tar.gz/g" "/tmp/$old_name" > "/tmp/$new_name"
            echo "  Updated filenames in metadata"

            if [[ "$DRY_RUN" == "true" ]]; then
              echo "  [DRY RUN] Would upload $new_name"
              echo "  [DRY RUN] Would delete $old_name"
              echo "  Content preview:"
              cat "/tmp/$new_name" | jq '.' | head -20
            else
              # Upload new metadata
              aws s3 cp "/tmp/$new_name" "s3://${{ secrets.R2_BUCKET_NAME }}/$new_name" --endpoint-url ${{ secrets.R2_ENDPOINT }}
              echo "  Uploaded $new_name"

              # Delete old metadata
              aws s3 rm "s3://${{ secrets.R2_BUCKET_NAME }}/$old_name" --endpoint-url ${{ secrets.R2_ENDPOINT }}
              echo "  Deleted $old_name"
            fi

            rm -f "/tmp/$old_name" "/tmp/$new_name"
          done

      - name: "Migrate sshpass files (macos → darwin)"
        run: |
          echo "=== Migrating sshpass files ==="

          for arch in arm64 x86_64; do
            # Migrate archive: sshpass-X.Y-macos-arch.tar.gz → sshpass-X.Y-darwin-arch.tar.gz
            old_archive="sshpass-1.10-macos-${arch}.tar.gz"
            new_archive="sshpass-1.10-darwin-${arch}.tar.gz"

            if aws s3api head-object --bucket ${{ secrets.R2_BUCKET_NAME }} --key "$old_archive" --endpoint-url ${{ secrets.R2_ENDPOINT }} >/dev/null 2>&1; then
              echo "  $old_archive → $new_archive"
              if [[ "$DRY_RUN" == "true" ]]; then
                echo "    [DRY RUN] Would rename"
              else
                # Download then re-upload (R2 copy doesn't work even with --copy-props none)
                aws s3 cp "s3://${{ secrets.R2_BUCKET_NAME }}/$old_archive" "/tmp/$old_archive" --endpoint-url ${{ secrets.R2_ENDPOINT }}
                aws s3 cp "/tmp/$old_archive" "s3://${{ secrets.R2_BUCKET_NAME }}/$new_archive" --endpoint-url ${{ secrets.R2_ENDPOINT }}
                aws s3 rm "s3://${{ secrets.R2_BUCKET_NAME }}/$old_archive" --endpoint-url ${{ secrets.R2_ENDPOINT }}
                rm -f "/tmp/$old_archive"
                echo "    Done"
              fi
            else
              echo "  Skip: $old_archive (not found)"
            fi

            # Migrate metadata: metadata-sshpass-arch.json → metadata-sshpass-darwin-arch.json
            old_meta="metadata-sshpass-${arch}.json"
            new_meta="metadata-sshpass-darwin-${arch}.json"

            if aws s3api head-object --bucket ${{ secrets.R2_BUCKET_NAME }} --key "$old_meta" --endpoint-url ${{ secrets.R2_ENDPOINT }} >/dev/null 2>&1; then
              echo "  $old_meta → $new_meta"

              # Download, update filename inside, upload
              aws s3 cp "s3://${{ secrets.R2_BUCKET_NAME }}/$old_meta" "/tmp/$old_meta" --endpoint-url ${{ secrets.R2_ENDPOINT }}

              # Update filename in metadata (macos → darwin)
              sed "s/-macos-/-darwin-/g" "/tmp/$old_meta" > "/tmp/$new_meta"

              if [[ "$DRY_RUN" == "true" ]]; then
                echo "    [DRY RUN] Would rename and update content"
                cat "/tmp/$new_meta" | jq '.'
              else
                aws s3 cp "/tmp/$new_meta" "s3://${{ secrets.R2_BUCKET_NAME }}/$new_meta" --endpoint-url ${{ secrets.R2_ENDPOINT }}
                aws s3 rm "s3://${{ secrets.R2_BUCKET_NAME }}/$old_meta" --endpoint-url ${{ secrets.R2_ENDPOINT }}
                echo "    Done"
              fi

              rm -f "/tmp/$old_meta" "/tmp/$new_meta"
            else
              echo "  Skip: $old_meta (not found)"
            fi
          done

      - name: "List archives to migrate"
        id: list_archives
        run: |
          echo "=== Listing archives to migrate ==="

          # Only migrate known database services
          KNOWN_SERVICES="mariadb mysql postgresql redis valkey"

          # List all archives that don't have OS in their name
          archives=""
          for arch in arm64 x86_64; do
            # List files ending with -arch.tar.gz but NOT containing darwin/linux/windows
            result=$(aws s3api list-objects-v2 \
              --bucket ${{ secrets.R2_BUCKET_NAME }} \
              --endpoint-url ${{ secrets.R2_ENDPOINT }} \
              --query "Contents[?ends_with(Key, '-${arch}.tar.gz')].Key" \
              --output text 2>/dev/null | tr '\t' '\n' || true)

            for file in $result; do
              # Skip if already has OS in name
              case "$file" in
                *-darwin-*|*-linux-*|*-windows-*|*-macos-*) continue ;;
              esac

              # Only include known services
              is_known=false
              for service in $KNOWN_SERVICES; do
                if [[ "$file" == ${service}-* ]]; then
                  is_known=true
                  break
                fi
              done

              if [[ "$is_known" == "true" ]]; then
                archives="$archives $file"
              else
                echo "  Skip: $file (not a known service)"
              fi
            done
          done

          if [[ -z "$archives" ]]; then
            echo "No archives to migrate"
            echo "has_archives=false" >> $GITHUB_OUTPUT
          else
            echo "Archives to migrate:"
            for f in $archives; do
              echo "  - $f"
            done
            echo "$archives" > /tmp/archives_to_migrate.txt
            echo "has_archives=true" >> $GITHUB_OUTPUT
          fi

      - name: "Configure AWS CLI timeouts"
        run: |
          # Increase timeouts for large file operations
          aws configure set default.s3.max_concurrent_requests 5
          aws configure set default.s3.multipart_chunksize 16MB
          aws configure set default.connect_timeout 60
          aws configure set default.read_timeout 300

      - name: "Migrate archive files"
        if: steps.list_archives.outputs.has_archives == 'true'
        run: |
          echo "=== Migrating archive files ==="

          archives=$(cat /tmp/archives_to_migrate.txt)
          failed_files=""

          for old_key in $archives; do
            # Skip if already has OS in name
            case "$old_key" in
              *-darwin-*|*-linux-*|*-windows-*) continue ;;
            esac

            # Determine architecture from filename
            if [[ "$old_key" == *"-arm64.tar.gz" ]]; then
              arch="arm64"
            elif [[ "$old_key" == *"-x86_64.tar.gz" ]]; then
              arch="x86_64"
            else
              echo "  Skip: $old_key (unknown architecture)"
              continue
            fi

            # Generate new key by inserting "darwin" before architecture
            new_key=$(echo "$old_key" | sed "s/-${arch}\.tar\.gz/-darwin-${arch}.tar.gz/")

            echo "  $old_key → $new_key"

            if [[ "$DRY_RUN" == "true" ]]; then
              echo "    [DRY RUN] Would copy and delete"
            else
              # Download then re-upload (R2 S3-to-S3 copy doesn't work even with --copy-props none)
              download_ok=false
              for attempt in 1 2 3; do
                echo "    Attempt $attempt/3 (download)..."
                if aws s3 cp "s3://${{ secrets.R2_BUCKET_NAME }}/$old_key" "/tmp/$old_key" \
                    --endpoint-url ${{ secrets.R2_ENDPOINT }}; then
                  echo "    Download successful"
                  download_ok=true
                  break
                else
                  echo "    Download failed, attempt $attempt"
                  sleep 5
                fi
              done

              if [[ "$download_ok" != "true" ]]; then
                echo "    WARNING: Skipping $old_key (corrupted or download failed - will need rebuild)"
                failed_files="$failed_files $old_key"
                # Delete corrupted file from R2
                echo "    Deleting corrupted file from R2..."
                aws s3 rm "s3://${{ secrets.R2_BUCKET_NAME }}/$old_key" --endpoint-url ${{ secrets.R2_ENDPOINT }} || true
                continue
              fi

              upload_ok=false
              for attempt in 1 2 3; do
                echo "    Attempt $attempt/3 (upload)..."
                if aws s3 cp "/tmp/$old_key" "s3://${{ secrets.R2_BUCKET_NAME }}/$new_key" \
                    --endpoint-url ${{ secrets.R2_ENDPOINT }}; then
                  echo "    Upload successful"
                  upload_ok=true
                  break
                else
                  echo "    Upload failed, attempt $attempt"
                  sleep 5
                fi
              done

              rm -f "/tmp/$old_key"

              if [[ "$upload_ok" != "true" ]]; then
                echo "    WARNING: Upload failed for $new_key"
                failed_files="$failed_files $old_key"
                continue
              fi

              # Delete old key only after successful upload
              aws s3 rm "s3://${{ secrets.R2_BUCKET_NAME }}/$old_key" --endpoint-url ${{ secrets.R2_ENDPOINT }}

              echo "    Done"
            fi
          done

          if [[ -n "$failed_files" ]]; then
            echo ""
            echo "⚠️  FILES THAT NEED REBUILD:"
            for f in $failed_files; do
              echo "  - $f"
            done
          fi

      - name: "Migration summary"
        run: |
          echo ""
          echo "╔════════════════════════════════════════╗"
          echo "║          Migration Complete             ║"
          echo "╚════════════════════════════════════════╝"
          echo ""
          if [[ "$DRY_RUN" == "true" ]]; then
            echo "This was a DRY RUN. No changes were made."
            echo ""
            echo "To perform the actual migration, run this workflow again"
            echo "with 'dry_run' set to 'false'."
          else
            echo "Migration completed successfully!"
            echo ""
            echo "You can now deploy the multi-OS build workflow."
            echo "This migration workflow can be deleted after verification."
          fi
