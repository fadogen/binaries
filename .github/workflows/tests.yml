name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Unit and regression tests (offline)
        run: python -m unittest discover -s tests/python -v
      - name: Install lint tool
        run: python -m pip install --group dev
      - name: Check Python style
        run: |
          ruff check .github/scripts/package-services.py .github/scripts/native_packages tests/python
          ruff format --check .github/scripts/package-services.py .github/scripts/native_packages tests/python
      - name: Check remaining shell entry points
        run: shellcheck --severity=warning .github/scripts/*.sh
