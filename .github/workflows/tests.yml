name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-uv
        with:
          dev: 'true'
      - name: Unit and regression tests (offline)
        run: uv run --locked python -m unittest discover -s tests/python -v
      - name: Check Python style
        run: |
          uv run --locked ruff check .github/scripts/package-*.py .github/scripts/native_packages .github/scripts/runtime_packages tests/python
          uv run --locked ruff format --check .github/scripts/package-*.py .github/scripts/native_packages .github/scripts/runtime_packages tests/python
      - name: Check remaining shell entry points
        run: shellcheck --severity=warning .github/scripts/*.sh
