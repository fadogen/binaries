name: Package Services

on:
  schedule:
    - cron: '0 2 * * *'
  push:
    branches: [main]
    paths:
      - '.github/scripts/native_packages/**'
      - '.github/scripts/package-services.py'
      - '.github/scripts/services-windows-downloader.sh'
      - '.github/config/services.json'
      - '.github/workflows/build-services.yml'
      - '.github/actions/setup-uv/**'
      - '.python-version'
      - 'pyproject.toml'
      - 'uv.lock'
  pull_request:
    paths:
      - '.github/scripts/native_packages/**'
      - '.github/scripts/package-services.py'
      - '.github/scripts/services-windows-downloader.sh'
      - '.github/config/services.json'
      - '.github/workflows/build-services.yml'
      - '.github/actions/setup-uv/**'
      - '.python-version'
      - 'pyproject.toml'
      - 'uv.lock'
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: 'Repackage selected services even if inputs match (e.g. mariadb@12 redis)'
        default: ''
        type: string
      filter_os:
        description: 'Target OS'
        default: all
        type: choice
        options: [all, darwin, linux, windows]

permissions:
  contents: read

# Production runs serialize planning, archive uploads and metadata merging.
# A PR has its own group and never receives publishing credentials.
concurrency:
  group: services-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      should-build: ${{ steps.plan.outputs.should-build }}
      publish: ${{ steps.mode.outputs.publish }}
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-uv
      - id: mode
        env:
          PUBLISH: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
        run: echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"
      - name: Read published metadata
        if: steps.mode.outputs.publish == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: uv run --locked --no-dev python .github/scripts/package-services.py fetch-metadata --metadata metadata
      - name: Freeze upstream inputs
        id: plan
        env:
          FORCE: ${{ inputs.force_rebuild }}
          FILTER_OS: ${{ inputs.filter_os }}
          EVENT: ${{ github.event_name }}
        run: |
          args=(--output package-plan.json --metadata metadata)
          if [[ -n "$FILTER_OS" && "$FILTER_OS" != all ]]; then
            args+=(--os "$FILTER_OS")
          fi
          if [[ -n "$FORCE" ]]; then
            read -r -a services <<< "$FORCE"
            args+=(--force "${services[@]}")
          fi
          # Windows retains its vendor sources; PR runtime qualification covers
          # the Unix engines replaced here. Windows retains a structural gate.
          [[ "$EVENT" != pull_request ]] || args+=(--native-only)
          uv run --locked --no-dev python .github/scripts/package-services.py plan "${args[@]}"
      - uses: actions/upload-artifact@v6
        with:
          name: package-plan
          overwrite: true
          path: package-plan.json
          retention-days: 7

  package:
    name: ${{ matrix.id }}
    needs: plan
    if: needs.plan.outputs.should-build == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-uv
      - uses: actions/download-artifact@v7
        with:
          name: package-plan
      - name: Install ELF packaging tools
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends patchelf binutils
      - name: Import signing certificate into an isolated keychain
        if: matrix.os == 'darwin' && needs.plan.outputs.publish == 'true'
        env:
          CERTIFICATE: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/services-signing.keychain-db"
          password=$(openssl rand -hex 32)
          echo "::add-mask::$password"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -P "$P12_PASSWORD" -T /usr/bin/codesign -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain"
          rm "$RUNNER_TEMP/certificate.p12"
          echo "SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
      - name: Assemble the planned runtime
        env:
          PACKAGE_ID: ${{ matrix.id }}
          TARGET_OS: ${{ matrix.os }}
          PUBLISH: ${{ needs.plan.outputs.publish }}
          SIGNING_IDENTITY: ${{ needs.plan.outputs.publish == 'true' && secrets.SIGNING_IDENTITY || '' }}
        run: |
          args=(--plan package-plan.json --id "$PACKAGE_ID" --output dist)
          if [[ "$TARGET_OS" == darwin && "$PUBLISH" == true ]]; then
            : "${SIGNING_IDENTITY:?Missing Developer ID signing identity}"
            args+=(--signing-identity "$SIGNING_IDENTITY" --keychain "$SIGNING_KEYCHAIN")
          fi
          uv run --locked --no-dev python .github/scripts/package-services.py build "${args[@]}"
      - name: Make Linuxbrew unavailable on the disposable runner
        if: matrix.os == 'linux'
        run: |
          if [[ -d /home/linuxbrew/.linuxbrew ]]; then
            sudo mv /home/linuxbrew/.linuxbrew "$RUNNER_TEMP/linuxbrew-disabled"
          fi
      - name: Verify the final archive after relocation
        id: verify
        env:
          PACKAGE_ID: ${{ matrix.id }}
        run: uv run --locked --no-dev python .github/scripts/package-services.py verify --plan package-plan.json --id "$PACKAGE_ID" --output dist
      - name: Attest the verified archive
        if: needs.plan.outputs.publish == 'true'
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ steps.verify.outputs.archive }}
      - name: Publish this successful archive
        if: needs.plan.outputs.publish == 'true'
        env:
          PACKAGE_ID: ${{ matrix.id }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: uv run --locked --no-dev python .github/scripts/package-services.py publish-archive --plan package-plan.json --id "$PACKAGE_ID" --output dist
      - name: Record a published success for metadata merging
        if: needs.plan.outputs.publish == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: published-${{ github.run_attempt }}-${{ matrix.id }}
          path: dist/${{ matrix.id }}.json
          retention-days: 7
      - name: Preserve qualification evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: proof-${{ github.run_attempt }}-${{ matrix.id }}
          path: |
            dist/*-evidence/**
            dist/*.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Remove the temporary signing keychain
        if: always() && matrix.os == 'darwin' && needs.plan.outputs.publish == 'true'
        run: |
          if [[ -e "$RUNNER_TEMP/services-signing.keychain-db" ]]; then
            security delete-keychain "$RUNNER_TEMP/services-signing.keychain-db"
          fi
          rm -f "$RUNNER_TEMP/certificate.p12"

  publish-metadata:
    name: Publish current catalogue and remove obsolete archives
    runs-on: ubuntu-24.04
    needs: [plan, package]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.publish == 'true' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-uv
      - uses: actions/download-artifact@v7
        with:
          name: package-plan
      - uses: actions/download-artifact@v7
        if: needs.plan.outputs.should-build == 'true'
        with:
          pattern: published-${{ github.run_attempt }}-*
          path: receipts
          merge-multiple: true
      - name: Reconcile the published catalogue before removing unreferenced archives
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          mkdir -p receipts
          uv run --locked --no-dev python .github/scripts/package-services.py publish-metadata --plan package-plan.json --receipts receipts

  catalogue:
    name: Report missing upstream targets
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-uv
      - uses: actions/download-artifact@v7
        with:
          name: package-plan
      - name: Require an available source for every requested target
        run: |
          uv run --locked --no-dev python - <<'PYTHON'
          import json
          plan = json.load(open('package-plan.json'))
          for entry in plan['unavailable']:
              print(entry)
          raise SystemExit(bool(plan['unavailable']))
          PYTHON
