name: Temporary Apple signing keychain
description: Import a Developer ID certificate using the GitHub documented keychain procedure.
inputs:
  certificate:
    description: Base64 encoded signing certificate.
    required: true
  password:
    description: Certificate import password.
    required: true
runs:
  using: composite
  steps:
    - name: Import and register the isolated keychain
      shell: bash
      env:
        CERTIFICATE: ${{ inputs.certificate }}
        P12_PASSWORD: ${{ inputs.password }}
      run: |
        keychain="$RUNNER_TEMP/fadogen-signing.keychain-db"
        certificate="$RUNNER_TEMP/fadogen-certificate.p12"
        password=$(openssl rand -hex 32)
        echo "::add-mask::$password"
        trap 'rm -f "$certificate"' EXIT
        security create-keychain -p "$password" "$keychain"
        echo "SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
        security set-keychain-settings -lut 21600 "$keychain"
        security unlock-keychain -p "$password" "$keychain"
        printf '%s' "$CERTIFICATE" | base64 --decode > "$certificate"
        security import "$certificate" -P "$P12_PASSWORD" -T /usr/bin/codesign -k "$keychain"
        security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain"
        security list-keychains -d user -s "$keychain"
        security find-identity -v -p codesigning "$keychain"
