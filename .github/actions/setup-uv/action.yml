name: Locked Python environment
description: Install the pinned uv and Python versions and sync the committed lockfile.
inputs:
  dev:
    description: Include development dependencies for tests and linting.
    default: 'false'
runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      with:
        enable-cache: ${{ inputs.dev == 'true' }}
    - name: Sync the locked environment
      shell: bash
      env:
        INSTALL_DEV: ${{ inputs.dev }}
      run: |
        args=(--locked --managed-python)
        if [[ "$INSTALL_DEV" != true ]]; then
          args+=(--no-dev)
        fi
        uv sync "${args[@]}"
